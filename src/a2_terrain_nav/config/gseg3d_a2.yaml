ground_segmentation:
  ros__parameters:
    use_sim_time: true
    robot_frame: base_link

    # A short forward-biased ROI is sufficient for the local costmap and keeps
    # the 128-line JT128 cloud affordable on CPU.
    maxX: 12.0
    minX: -5.0
    maxY: 8.0
    minY: -8.0
    maxZ: 3.0
    minZ: -3.0
    downsample: true
    downsample_resolution: 0.10

    # Nominal gait_demo base height (0.38 m) plus the JT128 Z mount (0.081 m).
    # This is signed: the floor is below the LiDAR in base_link coordinates.
    lidar_to_ground: -0.46
    transform_tolerance: 0.25

    cellSizeX: 0.50
    cellSizeY: 0.50
    cellSizeZ: 5.0
    cellSizeZPhase2: 0.50
    # The bundled ramp is 0.18 rad = 10.31 degrees.  Accept it with useful
    # sensor/noise margin, while retaining steeper faces as obstacles.
    slopeThresholdDegrees: 15.0
    groundInlierThreshold: 0.10
    centroidSearchRadius: 2.5
    use_imu_orientation: true
    # A 15 degree surface changes by 0.134 m across one 0.50 m cell.
    # This admits the ramp but still breaks expansion across a 0.20 m step.
    maxGroundHeightDeviation: 0.14
    show_benchmark: false
