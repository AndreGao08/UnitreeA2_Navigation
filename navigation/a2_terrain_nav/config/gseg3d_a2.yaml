ground_segmentation:
  ros__parameters:
    use_sim_time: true
    robot_frame: base_link

    # A short forward-biased ROI is sufficient for the local costmap and keeps
    # the 128-line JT128 cloud affordable on CPU.
    maxX: 12.0
    minX: -5.0
    maxY: 8.0
    minY: -8.0
    maxZ: 3.0
    minZ: -3.0
    downsample: true
    downsample_resolution: 0.10

    # Nominal gait_demo base height (0.38 m) plus the JT128 Z mount (0.081 m).
    # This is signed: the floor is below the LiDAR in base_link coordinates.
    lidar_to_ground: -0.46
    transform_tolerance: 0.25

    cellSizeX: 0.50
    cellSizeY: 0.50
    cellSizeZ: 5.0
    cellSizeZPhase2: 0.50
    # Only terrain within 5 degrees of gravity-level is traversable.  The
    # bundled 10.3 degree ramp is therefore intentionally classified as an
    # obstacle and kept out of the Nav2 local controller's free space.
    slopeThresholdDegrees: 5.0
    groundInlierThreshold: 0.10
    centroidSearchRadius: 2.5
    use_imu_orientation: true
    # A 5 degree surface changes by about 0.044 m across one 0.50 m cell.
    # Keep a small measurement margin while preventing phase-II expansion
    # across steeper surfaces or a 0.20 m step.
    maxGroundHeightDeviation: 0.05
    show_benchmark: false
